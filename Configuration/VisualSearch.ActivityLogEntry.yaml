Searches:
  # ===========================================================================
  # Suche nach Prüfungsort
  # Diese Suche ist der Hauptfilter zum Filtern von Prüfungsorten
  # ===========================================================================
  fucodo\contact\securitycenter\Domain\Model\ActivityLogEntry:
    search:
      repository: fucodo\contact\securitycenter\Domain\Repository\ActivityLogEntryRepository
    autocomplete:
      searchtext:
        label: "Suchtext"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - title
            - userIdentity
            - message
            - code
      date:
        label: "Datum (Tag)"
        inputType: date
        selector:
          conditions:
            once: true
          freeInput: true
          dateFormat: Y-m-d
        matches:
          \KayStrobach\VisualSearch\Demands\Date\DateDemand:
            - createdAt
      code:
        label: "Code"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - code
      severity:
        label: "Auswirkung"
        selector:
          conditions:
            once: true
          values:
            Notice: Notice
            Warning: Warning
            Error: Error
            OK: OK
        matches:
          like:
            - severity
